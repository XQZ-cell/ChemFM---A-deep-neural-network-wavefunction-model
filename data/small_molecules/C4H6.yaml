# config_for_DeepQMC.yaml

batch_size: 2048
mode: inference

log:
  restore_path: '/data/home/yinchang/DeepQMC/checkpoints/small_mol/C4H6(2)'
  save_path: '/data/home/yinchang/DeepQMC/checkpoints/C4H6_no_gate'
  max_to_keep: 10

network:
  network_type: psiformer
  psiformer:
    use_gate: true
    use_edge_bias: false
    num_heads: 4
    heads_dim: 64
  jastrow: simple
  rescale_inputs: true
  bias_orbitals: false

optim:
  optimizer: kfac
  iterations: 10000

pretrain:
  iterations: 20000

